<div class="card mb-3">
  <div class="card-body">
    <h4 class="card-title">Permissions</h4>
    <h6 class="card-subtitle mb-4 text-muted">Create and view all permissions</h6>

    @if (message) {
    <div class="alert alert-danger">{{ message }}</div>
    }

    <form (ngSubmit)="createPermission()" class="row g-3 mb-3">
      <div class="col-md-4">
        <label class="form-label">Permission Name</label>
        <input
          class="form-control"
          [(ngModel)]="name"
          name="name"
          placeholder="e.g. users.create"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Description</label>
        <input
          class="form-control"
          [(ngModel)]="description"
          name="description"
          placeholder="Optional description"
        />
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Create' }}
        </button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table align-middle text-nowrap">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          @for (permission of permissions; track permission.id) {
          <tr>
            <td><code>{{ permission.id }}</code></td>
            <td>{{ permission.name }}</td>
            <td>{{ permission.description }}</td>
          </tr>
          } @empty {
          <tr>
            <td colspan="3" class="text-center">No permissions found</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
