<p>user-list works!</p>
<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="card-title">Users</h4>
            <a routerLink="create" class="btn btn-primary">Create User</a>
        </div>

        @if (message) {
        <div class="alert alert-danger">{{ message }}</div>
        }

        <div class="table-responsive">
            <table class="table align-middle text-nowrap">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Extension</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (user of users; track user.id) {
                    <tr>
                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.extension }}</td>
                        <td>{{ user.role }}</td>
                        <td>
                            <span class="badge" [ngClass]="{'bg-success': user.status === 'enabled', 'bg-danger': user.status === 'disabled'}">
                                {{ user.status | titlecase }}
                            </span>
                        </td>
                        <td>
                            <a [routerLink]="['edit', user.id]" class="btn btn-sm btn-info me-2 text-white">Edit</a>
                            <button class="btn btn-sm btn-danger" (click)="deleteUser(user.id)">Delete</button>
                        </td>
                    </tr>
                    }
                    @empty {
                    <tr>
                        <td colspan="6" class="text-center">No users found</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
