<div class="card">
    <div class="card-body">
        <div class="d-md-flex align-items-center">
            <div>
                <h4 class="card-title">Answered Calls Trend</h4>
                <h5 class="card-subtitle text-muted">Filtered by User and Time Range</h5>
            </div>
            <div class="ms-auto d-flex gap-2 mt-2 mt-md-0">
                <select class="form-select form-select-sm" style="min-width: 180px;"
                    [(ngModel)]="selectedUserId" (change)="onFiltersChanged()">
                    <option value="all">All Users</option>
                    <option *ngFor="let u of users" [value]="u.id">{{ u.name || u.username }} ({{ u.extension }})</option>
                </select>
                <select class="form-select form-select-sm" style="min-width: 140px;"
                    [(ngModel)]="selectedRange" (change)="onFiltersChanged()">
                    <option value="24h">Last 24 Hours</option>
                    <option value="7d">Last 7 Days</option>
                    <option value="1m">1 Month</option>
                    <option value="1y">1 Year</option>
                </select>
            </div>
        </div>
        <div class="row mt-3">
            <!-- column -->
            <div class="col-lg-12">
                <div>
                    <div class="d-flex flex-column w-100">
                        <apx-chart [series]="salesChartOptions.series" [chart]="salesChartOptions.chart"
                            [xaxis]="salesChartOptions.xaxis" [yaxis]="salesChartOptions.yaxis"
                            [grid]="salesChartOptions.grid" [stroke]="salesChartOptions.stroke"
                            [tooltip]="salesChartOptions.tooltip" [dataLabels]="salesChartOptions.dataLabels"
                            [legend]="salesChartOptions.legend" [colors]="salesChartOptions.colors"
                            [markers]="salesChartOptions.markers">
                        </apx-chart>
                    </div>
                </div>
            </div>
            <!-- column -->
        </div>
    </div>
</div>
