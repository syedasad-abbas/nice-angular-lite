<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="card-title">Roles</h4>
            <a routerLink="create" class="btn btn-primary">Create Role</a>
        </div>

        @if (message) {
        <div class="alert alert-danger">{{ message }}</div>
        }

        <div class="table-responsive">
            <table class="table align-middle text-nowrap">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (role of roles; track role.id) {
                    <tr>
                        <td><code>{{ role.id }}</code></td>
                        <td>{{ role.name }}</td>
                        <td>{{ role.description }}</td>
                        <td>
                            <a [routerLink]="['edit', role.id]" class="btn btn-sm btn-info me-2 text-white">Edit</a>
                            <button class="btn btn-sm btn-danger" (click)="deleteRole(role.id)" [disabled]="['admin', 'agent', 'user'].includes(role.id)">Delete</button>
                        </td>
                    </tr>
                    }
                    @empty {
                    <tr>
                        <td colspan="4" class="text-center">No roles found</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
