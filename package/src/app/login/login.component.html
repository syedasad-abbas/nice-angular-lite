<div class="d-flex align-items-center justify-content-center vh-100 bg-light" style="min-height: 100vh;">
  <div class="card shadow" style="width: 100%; max-width: 400px; border-radius: 10px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h3 class="mb-2">Welcome Back</h3>
        <p class="text-muted">Please sign in to access your dashboard</p>
      </div>
      
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" placeholder="admin">
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" placeholder="admin">
        </div>
        
        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
      </form>
      
      @if (errorMessage) {
        <div class="alert alert-danger mt-3 mb-0 text-center" role="alert">
          {{ errorMessage }}
        </div>
      }
    </div>
  </div>
</div>
